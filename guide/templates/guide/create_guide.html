<!DOCTYPE html>
{% load static %}

<html>

<head>

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=UA-163168954-1"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        function gtag() {
            dataLayer.push(arguments);
        }

        gtag('js', new Date());

        gtag('config', 'UA-163168954-1');
    </script>
    <meta http-equiv="Content-Type" content="text/html" ; charset="utf-8">
    <link rel="stylesheet" type="text/css" href="{% static 'guide/css/create.css' %}" />
    <title>
        ガイド新規作成ページ
    </title>
    <script src="https://code.jquery.com/jquery-3.0.0.min.js"></script>
    <script src="{% static 'guide/js/jquery.selection.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>


<body>
    <header class="header">
        {% include 'top/site_header.html' %}
        {% include 'guide/guide_header.html' %}
    </header>

    <script type="text/javascript"></script>

    <div class="wrapper">
        <main class="main">
            <div class="page_title_field">
                <h1>ガイド作成ページ</h1>
            </div>
            <div class="edit_guide_introduction">
                <div class="guide_introduction">
                    ガイドを作成できるページです。<br />
                    ガイドを作ってあなたの知識をみんなと共有しましょう!<br />
                </div>

                <div class="guide_help_menu">
                    <div class="guide_help_menu_item">
                        <a href="{% url 'guide:detail' 1 %}" target="_blank">ガイドの書き方</a>はこちら
                    </div>
                </div>
            </div>

            <div style="width:1200px;">
                <form method="post">
                {%csrf_token%}
                {{form.media }}
                {{form.as_p}}
                <button type="submit" class="guide_form_submit">送信</button>
                </form>
            </div>
            <!--
            <footer>
                {% include 'top/footer.html' %}
            </footer>
            -->
</body>

</html>
