<!DOCTYPE html>
{% load static %}
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html" ; charset="utf-8">
    <link rel="stylesheet" type="text/css" href="{% static 'top/css/index.css' %}"/>
    <title>
        プロフィール編集ページ
    </title>
</head>
<header class="header">
    {% include 'top/site_header.html' %}

</header>
<body>

<div class="wrapper">

    <form action="{% url 'top:update_profile' %}" method="POST">
        {% csrf_token %}
        < class="main">
            <H1>アカウント登録ありがとうございます！</H1>
            プロフィールの初期設定ページです。<br>
            以下の情報を入力してください。<br>
            ガイドを書いた際の一番下にあなたのプロフィールが表示されます。<br>
            <table>
                {{form.as_table}}
            </table>
        </main>
        <input type="hidden" name="next" value="top:registration_finish">
        <input type="submit" value="更新">
    </form>

</div>
</body>
</html>
