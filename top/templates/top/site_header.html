<nav class="site_header">

    <ul class="site_menu">
        <li class="site_menu_item site_logo"><a href="{% url 'top:index' %}" target="_self">TEKKEN MANIAX</a></li>
        <li class="site_menu_item"><a href="{% url 'guide:index' %}" target="_self">GUIDE </a></li>
        <li class="site_menu_item"><a href="{% url 'database:index' %}" target="_self">DATABASE</a></li>
        <li class="site_menu_item"><a href="{% url 'stream:index' %}" target="_self">STREAM</a></li>
        <li class="site_menu_item"><a href="{% url 'video:index' %}" target="_self">VIDEO</a></li>
    </ul>

    <ul class="login_menu">

        {% if user.is_authenticated %}
            <li class="login_menu_item">
                {% if num_of_unread == 0 %}
                    <a href="{% url 'top:notification' %}" target="_self">通知 なし</a></li>
                {% else %}
                    <div class ="unread">
                    <a href="{% url 'top:notification' %}" target="_self">通知 {{ num_of_unread }}</a></li>
                    </div>
                {% endif %}
            <li class="login_menu_item notification"><a href="{% url 'top:account_manager' %}"
                                                        target="_self">{{ user.username }}さん</a></li>
            <li class="login_menu_item"><a href="{% url 'logout' %}?next={% url 'top:logout_complete' %}"
                                           target="_self">ログアウト</a></li>
        {% else %}
            <li class="login_menu_item"><a href="{% url 'login' %}?next={{ request.get_full_path }}"
                                           target="_self">ログイン</a></li>
            <li class="login_menu_item"><a href="{% url 'top:register' %}" target="_self">新規登録</a></li>
        {% endif %}
    </ul>
